<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog Card | GreatFrontEnd Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="img/favicon.ico" sizes="any" />
  </head>
  <body>
    <section class="blog-card">
      <div class="blog-image">
        <img
          src="./img/spacejoy-YqFz7UMm8qE-unsplash.jpg"
          alt="Blog Image"
          class="image"
        />
      </div>
      <div class="blog-content">
        <span class="tag">Interior</span>
        <h1 class="blog-title">Top 5 Living Room Inspirations</h1>
        <p class="blog-description">
          Curated vibrants colors for your living, make it pop & calm in the
          same time.
        </p>
        <div class="morebutton">
          <a href="#" aria-level="read-more" class="readmore">Read more &nbsp;<i class="fa-solid fa-arrow-right fa-icon"></i></a>
        </div>
      </div>
    </section>
  </body>
</html>
